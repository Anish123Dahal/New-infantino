name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: petition, POSTGRES_PASSWORD: petition, POSTGRES_DB: petition }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U petition" --health-interval 5s --health-timeout 3s --health-retries 10
      redis: { image: redis:7, ports: ["6379:6379"] }
    env:
      DATABASE_URL: postgresql://petition:petition@localhost:5432/petition
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-at-least-thirty-two-characters
      HASH_PEPPER: ci-pepper-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
